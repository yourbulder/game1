<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ec" />
  <title>LET OFF — Party Games</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff7ed;
      --card: #fffdf9;
      --ink: #17233f;
      --muted: #737989;
      --line: #efdfd2;
      --blue: #6488bd;
      --blue-dark: #496b9a;
      --coral: #f08050;
      --yellow: #f4c35b;
      --green: #78ad8a;
      --lavender: #9c83bd;
      --soft-blue: #eaf0fb;
      --soft-coral: #fff0e8;
      --soft-yellow: #fff4d9;
      --soft-green: #eaf5ec;
      --shadow: 0 9px 24px rgba(70, 54, 42, .075);
      --shadow-hover: 0 14px 30px rgba(70, 54, 42, .12);
      --radius: 22px;
      --accent-rgb: 100, 136, 189;
    }
    body[data-theme="spy"] {
      --paper: #f6f1f8;
      --card: #fffdfd;
      --ink: #302d3b;
      --muted: #797582;
      --line: #e7e1eb;
      --blue: #8e76b0;
      --blue-dark: #5b456f;
      --coral: #e88a74;
      --yellow: #d8b675;
      --green: #7b9a86;
      --soft-blue: #eee8f5;
      --soft-coral: #f7eae6;
      --soft-yellow: #f7f0e2;
      --soft-green: #eaf1eb;
      --accent-rgb: 142, 118, 176;
    }
    body[data-theme="charades"] {
      --paper: #f6f0e6;
      --card: #fffdf8;
      --ink: #29334a;
      --muted: #727887;
      --line: #e9decf;
      --blue: #718fb7;
      --blue-dark: #4b668f;
      --coral: #cf805f;
      --yellow: #d7b66d;
      --green: #78967c;
      --soft-blue: #eaf0f7;
      --soft-coral: #f7eae3;
      --soft-yellow: #f7f0df;
      --soft-green: #e9f0e7;
      --accent-rgb: 113, 143, 183;
    }
    body[data-theme="sketch"] {
      --paper: #f1f6ef;
      --card: #fffdf9;
      --ink: #2d3832;
      --muted: #737d75;
      --line: #e1e8df;
      --blue: #6c9676;
      --blue-dark: #496f55;
      --coral: #d77d59;
      --yellow: #d8b46a;
      --green: #739677;
      --soft-blue: #e7f1e9;
      --soft-coral: #f7eae2;
      --soft-yellow: #f6f0df;
      --soft-green: #e5efe5;
      --accent-rgb: 108, 150, 118;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 0%, rgba(var(--accent-rgb), .085), transparent 32rem),
        radial-gradient(ellipse at 100% 35%, rgba(201, 130, 105, .055), transparent 30rem),
        var(--paper);
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color .28s ease, color .28s ease;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(var(--accent-rgb), .27); outline-offset: 2px; }
    .app { width: min(100%, 760px); min-height: 100dvh; margin: 0 auto; padding: max(17px, env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 11px; border: 0; padding: 0; color: var(--ink); background: transparent; text-align: left; }
    .brand-mark { display: grid; place-items: center; width: 43px; height: 43px; border-radius: 15px; color: #fff; background: linear-gradient(145deg, var(--blue), var(--blue-dark)); font-weight: 950; font-size: 18px; letter-spacing: -1px; box-shadow: 0 5px 12px rgba(var(--accent-rgb), .22); }
    .brand-name { display: block; font-size: 20px; font-weight: 950; letter-spacing: 1.45px; line-height: 1; }
    .brand-sub { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: 1px; }
    .top-tag { border: 1px solid var(--line); padding: 8px 11px; border-radius: 999px; color: var(--muted); background: rgba(255,254,250,.78); font-size: 10px; font-weight: 850; letter-spacing: .45px; white-space: nowrap; }
    .screen { animation: screen-in .34s cubic-bezier(.2,.7,.25,1) both; }
    @keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .eyebrow { margin: 0 0 9px; color: var(--blue-dark); font-size: 10px; font-weight: 950; letter-spacing: 1.65px; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 11px; font-size: clamp(34px, 8.4vw, 51px); line-height: .99; letter-spacing: -2.2px; }
    h2 { margin-bottom: 9px; font-size: clamp(25px, 6.4vw, 34px); line-height: 1.08; letter-spacing: -1px; }
    h3 { margin-bottom: 7px; font-size: 16px; letter-spacing: -.2px; }
    .subtext { max-width: 560px; margin-bottom: 21px; color: var(--muted); font-size: 14px; line-height: 1.62; }
    .hero { position: relative; isolation: isolate; overflow: hidden; padding: 27px 23px 25px; border: 1px solid #eadfcd; border-radius: 27px; background: linear-gradient(118deg, #f5e9d7 0%, #f8eee3 55%, #f2e7de 100%); box-shadow: var(--shadow); }
    .hero::before, .hero::after { content: ""; position: absolute; z-index: -1; border-radius: 50%; pointer-events: none; }
    .hero::before { width: 195px; height: 195px; right: -42px; top: -85px; background: rgba(255,255,255,.37); }
    .hero::after { width: 125px; height: 125px; right: 56px; bottom: -89px; background: rgba(201,130,105,.12); }
    .hero-mark { position: absolute; right: 19px; top: 17px; display: grid; place-items: center; width: 57px; height: 57px; border-radius: 19px; background: rgba(255,255,255,.48); font-size: 33px; transform: rotate(7deg); }
    .hero h1 { max-width: 420px; padding-right: 48px; }
    .hero p { max-width: 430px; margin-bottom: 0; color: #6c665f; line-height: 1.58; font-size: 14px; }
    .hero .eyebrow { color: #927052; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 25px 2px 12px; }
    .section-head h2 { margin: 0; font-size: 19px; letter-spacing: -.45px; }
    .section-head span { color: var(--muted); font-size: 11px; font-weight: 650; }
    .game-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .game-card { position: relative; display: flex; gap: 15px; align-items: center; width: 100%; min-height: 112px; padding: 16px; border: 1px solid var(--line); border-radius: 21px; background: var(--card); box-shadow: var(--shadow); text-align: left; color: var(--ink); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .game-card:active { transform: scale(.985); }
    .game-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .game-card:focus-visible { border-color: var(--blue); }
    .game-icon { flex: 0 0 63px; display: grid; place-items: center; width: 63px; height: 63px; border-radius: 19px; font-size: 29px; }
    .game-icon.spy { background: linear-gradient(145deg, #f2e9f3, #eee4e8); }
    .game-icon.sketch { background: linear-gradient(145deg, #e7f0e4, #e8eee7); }
    .game-info { min-width: 0; flex: 1; }
    .game-info h3 { margin: 0 0 5px; font-size: 17px; }
    .game-info p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.48; }
    .arrow { color: var(--blue); font-size: 25px; font-weight: 800; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
    .pill { padding: 7px 10px; border-radius: 999px; background: #fbfaf7; border: 1px solid var(--line); color: #69716f; font-size: 10px; font-weight: 800; }
    .panel { padding: 18px; border: 1px solid var(--line); border-radius: 21px; background: var(--card); box-shadow: var(--shadow); }
    .panel + .panel { margin-top: 12px; }
    .panel > h3:first-child { margin-top: 1px; }
    .field-label { display: block; margin: 15px 0 7px; color: var(--ink); font-size: 11px; font-weight: 850; letter-spacing: .15px; }
    .field, .select { width: 100%; min-height: 47px; padding: 11px 13px; border: 1px solid #dedfdc; border-radius: 13px; outline: none; color: var(--ink); background: #fffefa; transition: border-color .18s ease, box-shadow .18s ease; }
    .field:focus, .select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .12); }
    .player-list { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .player-field { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .player-num { display: grid; place-items: center; flex: 0 0 28px; width: 28px; height: 28px; border-radius: 10px; background: var(--soft-blue); color: var(--blue-dark); font-size: 10px; font-weight: 950; }
    .player-field input { min-width: 0; height: 43px; padding: 8px 10px; border: 1px solid #e4e4df; border-radius: 11px; width: 100%; color: var(--ink); background: #fffefa; outline: none; }
    .player-field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .10); }
    .player-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
    .small-btn { border: 0; background: transparent; color: var(--blue-dark); font-size: 11px; font-weight: 900; padding: 8px 0; }
    .small-btn:disabled { opacity: .35; cursor: not-allowed; }
    .counter { color: var(--muted); font-size: 11px; font-weight: 800; white-space: nowrap; }
    .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 13px 17px; border: 1px solid transparent; border-radius: 15px; color: #fff; background: linear-gradient(135deg, var(--blue), var(--blue-dark)); font-size: 14px; font-weight: 900; letter-spacing: .05px; box-shadow: 0 6px 14px rgba(var(--accent-rgb), .18); transition: transform .16s ease, box-shadow .16s ease, filter .16s ease; }
    .btn:hover { filter: brightness(1.035); box-shadow: 0 8px 18px rgba(var(--accent-rgb), .22); }
    .btn:active { transform: translateY(1px) scale(.99); box-shadow: 0 3px 8px rgba(var(--accent-rgb), .16); }
    .btn.coral { color: #fff; background: linear-gradient(135deg, #cf8b76, #b96d5d); box-shadow: 0 6px 14px rgba(185,109,93,.16); }
    .btn.green { color: #fff; background: linear-gradient(135deg, #82a287, #63846b); box-shadow: 0 6px 14px rgba(99,132,107,.17); }
    .btn.yellow { color: #5b4828; background: linear-gradient(135deg, #ecd39a, #d6b36a); box-shadow: 0 6px 14px rgba(180,145,79,.15); }
    .btn.outline { color: var(--blue-dark); background: rgba(255,254,250,.88); border: 1px solid var(--line); box-shadow: none; }
    .btn.full { width: 100%; margin-top: 16px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .back-btn { display: inline-flex; align-items: center; gap: 7px; margin: 0 0 16px; padding: 8px 0; border: 0; color: var(--muted); background: transparent; font-size: 12px; font-weight: 850; }
    .back-btn:hover { color: var(--blue-dark); }
    .notice { padding: 12px 14px; border: 1px solid rgba(var(--accent-rgb), .08); border-radius: 14px; background: var(--soft-blue); color: var(--blue-dark); font-size: 12px; line-height: 1.55; }
    .notice.warm { background: var(--soft-yellow); color: #78643b; border-color: #eee4c9; }
    .notice.green { background: var(--soft-green); color: #4c6d51; border-color: #dce8d9; }
    .notice.coral { background: var(--soft-coral); color: #925d50; border-color: #efdfd8; }
    .center { text-align: center; }
    .center .subtext { max-width: 420px; }
    .big-emoji { margin: 7px 0 13px; font-size: 45px; filter: saturate(.82); }
    .secret-word { margin: 18px 0; padding: 23px 15px; border: 1.5px dashed rgba(var(--accent-rgb), .40); border-radius: 19px; background: var(--soft-blue); color: var(--blue-dark); font-size: clamp(27px, 8vw, 39px); font-weight: 950; letter-spacing: -.9px; overflow-wrap: anywhere; }
    .role-tag { display: inline-block; padding: 8px 12px; border-radius: 999px; font-size: 10px; font-weight: 950; letter-spacing: 1px; text-transform: uppercase; }
    .role-tag.villager { background: var(--soft-green); color: #4d7757; }
    .role-tag.spy { background: var(--soft-coral); color: #a65d4e; }
    .step-dots { display: flex; justify-content: center; gap: 6px; margin: 16px 0 20px; }
    .step-dot { width: 7px; height: 7px; border-radius: 50%; background: #d9d9d4; transition: width .2s ease, background .2s ease; }
    .step-dot.done { background: var(--green); }
    .step-dot.active { width: 21px; border-radius: 10px; background: var(--blue); }
    .vote-list { display: grid; gap: 9px; margin-top: 16px; }
    .vote-option { display: flex; align-items: center; justify-content: space-between; min-height: 51px; width: 100%; padding: 12px 15px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--card); text-align: left; font-size: 13px; font-weight: 850; transition: border-color .16s ease, background .16s ease, transform .16s ease; }
    .vote-option::after { content: "›"; color: var(--blue); font-size: 21px; line-height: 1; }
    .vote-option:active, .vote-option.selected { border-color: var(--blue); background: var(--soft-blue); transform: scale(.99); }
    .results-table { width: 100%; border-collapse: collapse; margin: 13px 0; font-size: 12px; }
    .results-table th, .results-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    .results-table th { color: var(--muted); font-size: 9px; font-weight: 900; letter-spacing: .9px; text-transform: uppercase; }
    .results-table tbody tr:last-child td { border-bottom: 0; }
    .result-banner { padding: 20px 17px; border: 1px solid transparent; border-radius: 20px; text-align: center; }
    .result-banner.win { background: var(--soft-green); border-color: #dce8da; }
    .result-banner.lose { background: var(--soft-coral); border-color: #efdfd8; }
    .result-banner h2 { margin-bottom: 6px; }
    .result-banner p { font-size: 13px; }
    .draw-wrap { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: var(--shadow); }
    .draw-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 9px; padding: 11px; border-bottom: 1px solid var(--line); background: #faf8f2; }
    .swatches { display: flex; gap: 8px; align-items: center; }
    .swatch { width: 29px; height: 29px; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 0 1px #d4d4ce; }
    .swatch.active { box-shadow: 0 0 0 2px var(--blue); transform: scale(1.05); }
    .tool-btn { min-height: 34px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: #fffefa; font-size: 11px; font-weight: 850; }
    .tool-btn:active { background: var(--soft-blue); }
    canvas { display: block; width: 100%; height: 310px; touch-action: none; background: #fff; }
    .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .drawing-card { min-width: 0; padding: 9px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); box-shadow: 0 4px 14px rgba(53,49,42,.04); }
    .drawing-card img { display: block; width: 100%; aspect-ratio: 1.2; object-fit: contain; background: #fff; border: 1px solid #efeee9; border-radius: 10px; }
    .drawing-card strong { display: block; margin-top: 8px; font-size: 11px; overflow-wrap: anywhere; }
    .muted { color: var(--muted); }
    .footer-note { margin: 24px 4px 0; color: #8a8d8a; font-size: 10px; line-height: 1.55; text-align: center; }
    .hidden { display: none !important; }
    @media (max-width: 360px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .top-tag { padding: 7px 8px; font-size: 9px; }
      .brand-sub { font-size: 8px; letter-spacing: .75px; }
      .player-list { grid-template-columns: 1fr; }
      .option-grid { grid-template-columns: 1fr; }
      .hero { padding: 24px 18px; }
      .panel { padding: 15px; }
    }
    @media (min-width: 600px) {
      .app { padding-top: 25px; }
      .game-grid { grid-template-columns: 1fr 1fr; }
      .game-card { min-height: 165px; align-items: flex-start; flex-direction: column; gap: 10px; }
      .game-card .arrow { align-self: flex-end; margin-top: -24px; }
      .game-icon { width: 57px; height: 57px; flex-basis: 57px; }
      .gallery { grid-template-columns: repeat(3, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    /* LET OFF visual system — warm illustrated mobile game UI */
    .app { width: min(100%, 560px); padding: max(15px, env(safe-area-inset-top)) 15px calc(30px + env(safe-area-inset-bottom)); }
    .topbar { margin-bottom: 17px; }
    .brand-mark { border-radius: 15px; background: linear-gradient(145deg,#243455,#15213b); box-shadow: 0 5px 0 #101a30; }
    .top-tag { background: #fffdf9; color: #6f7484; }
    .hero { padding: 23px 20px 20px; border-radius: 28px; border-color: #f0d9c7; background: linear-gradient(145deg,#fff0d5 0%,#fff8ed 56%,#fbe9df 100%); box-shadow: 0 8px 0 rgba(221,185,153,.22), var(--shadow); }
    .hero::before { width: 205px; height: 205px; right: -60px; top: -110px; background: #ffe3a7; opacity:.68; }
    .hero::after { width: 180px; height: 180px; left: -95px; bottom: -130px; background: #dce9f6; opacity:.62; }
    .hero-mark { width: auto; height: auto; right: 15px; top: 14px; border-radius: 50%; background: transparent; font-size: 39px; }
    .hero h1 { max-width: 390px; padding-right: 42px; font-size: clamp(32px,8vw,44px); letter-spacing:-1.8px; }
    .hero .eyebrow { color:#b66d45; }
    .hero p { color:#655d59; }
    .hero-people { display:flex; align-items:flex-end; gap:8px; margin:16px 0 13px; min-height:75px; }
    .hero-person { display:grid; place-items:center; width:58px; height:58px; border:3px solid rgba(255,255,255,.85); border-radius:21px; font-size:32px; box-shadow:0 5px 12px rgba(64,58,56,.09); transform:rotate(-4deg); }
    .hero-person:nth-child(2){transform:translateY(-8px) rotate(3deg);background:#f8d5c7!important}
    .hero-person:nth-child(3){transform:rotate(4deg);background:#dce9f7!important}
    .hero-person:nth-child(4){transform:translateY(-4px) rotate(-2deg);background:#eadcf4!important}
    .hero-ribbon { display:inline-flex; align-items:center; padding:8px 13px; border-radius:10px 13px 10px 13px; background:#ffcf78; color:#3b2c21; font-size:12px; font-weight:950; transform:rotate(-2deg); box-shadow:0 3px 0 #edb85f; }
    .home-play { width:100%; min-height:60px; margin-top:17px; border-radius:20px; background:linear-gradient(135deg,#ff9860,#ed7048); color:#fff; font-size:18px; box-shadow:0 6px 0 #d65a36, 0 10px 18px rgba(215,96,58,.13); }
    .home-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:14px; }
    .home-action { min-height:76px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:10px 5px; border:1px solid #f0dfd2; border-radius:17px; color:var(--ink); background:#fffdf9; box-shadow:0 4px 12px rgba(66,54,46,.045); font-size:11px; font-weight:900; }
    .home-action .action-icon { font-size:23px; line-height:1; }
    .section-head { margin-top:23px; }
    .game-grid { gap:12px; }
    .game-card { min-height:116px; padding:15px; border-radius:21px; box-shadow:0 5px 0 rgba(56,51,45,.035),var(--shadow); }
    .game-card.spy-card { background:linear-gradient(135deg,#ffe4d8,#fff0e9); border-color:#f3d2c3; }
    .game-card.sketch-card { background:linear-gradient(135deg,#e1efd9,#f1f6e9); border-color:#d6e4ce; }
    .game-card.charades-card { background:linear-gradient(135deg,#e7eafa,#f4eafa); border-color:#d9dced; }
    .game-icon.charades { background:linear-gradient(145deg,#e8eafa,#f1e5f0)!important; }
    .game-icon { width:66px;height:66px;flex-basis:66px;border-radius:20px;font-size:34px;background:rgba(255,255,255,.48)!important; }
    .game-info h3 { font-size:17px; color:#18233d; }
    .game-info p { color:#666c78; }
    .arrow { display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:50%;color:#fff;background:#ed8057;font-size:23px; }
    .panel { border-radius:20px; }
    .btn { border-radius:16px; min-height:50px; }
    .btn.green { background:linear-gradient(135deg,#82b994,#68a77e); box-shadow:0 5px 0 #568967,0 8px 16px rgba(72,133,92,.12); }
    .btn.coral { background:linear-gradient(135deg,#ff9564,#ec704b); box-shadow:0 5px 0 #cf5f3b,0 8px 16px rgba(207,95,59,.12); }
    .btn.purple { background:linear-gradient(135deg,#a28ac6,#8466ac); box-shadow:0 5px 0 #654b8b; }
    .btn.blue { background:linear-gradient(135deg,#7c9fcf,#5d7fae); box-shadow:0 5px 0 #48688f; }
    .back-btn { color:#596176; }

    function playerField(name,i) { return `<div class="player-field"><span class="player-num">${PLAYER_AVATARS[i]||'🙂'}</span><input aria-label="Player ${i+1} name" maxlength="18" value="${esc(name)}" data-player-index="${i}" onchange="updatePlayerName(${i},this.value)" oninput="updatePlayerName(${i},this.value)">${playerNames.length>3?`<button type="button" class="remove-player" aria-label="Remove ${esc(name)}" onclick="removePlayer(${i})">×</button>`:''}</div>`; }
    function removePlayer(index) { syncPlayerNames(); if(playerNames.length<=3)return; playerNames.splice(index,1); renderSetup(); }
    function updatePlayerName(index,value) { playerNames[index] = value; }
    function syncPlayerNames() {
      const fields = [...document.querySelectorAll('[data-player-index]')];
      playerNames = fields.map((f,i)=>f.value.trim() || `Player ${i+1}`);
      const seen = new Set();
      playerNames = playerNames.map((name,i)=> { let unique=name, n=2; while(seen.has(unique.toLowerCase())) unique=`${name} ${n++}`; seen.add(unique.toLowerCase()); return unique; });
    }
    function changePlayerCount(delta) {
      syncPlayerNames();
      const next = Math.max(3,Math.min(12,playerNames.length+delta));
      if (next>playerNames.length) playerNames.push(`Player ${next}`); else playerNames.pop();

    function currentCharadesPrompt() {
      if (round.promptIndex >= round.promptDeck.length) {
        const lastWord = round.promptDeck.length ? round.promptDeck[round.promptDeck.length-1].word : '';
        const refill = shuffle(CHARADES_PROMPTS.filter(p=>currentSetup.category==='Any category'||p.category===currentSetup.category));
        round.promptDeck = refill.length ? refill : shuffle(CHARADES_PROMPTS);
        if (round.promptDeck.length > 1 && round.promptDeck[0].word === lastWord) [round.promptDeck[0],round.promptDeck[1]] = [round.promptDeck[1],round.promptDeck[0]];
        round.promptIndex = 0;
      }
      return round.promptDeck[round.promptIndex];

    function beginCharadesTurn() {
      clearInterval(charadesTimerInterval);

    }
    function renderSaboteurGuess() {
      appView.innerHTML = `<button class="back-btn" onclick="confirmQuit()">← Exit round</button><p class="eyebrow">SKETCH &amp; SABOTAGE · FINAL CHANCE</p><section class="panel center"><div class="big-emoji">😈</div><h2>The saboteur was caught!</h2><p class="subtext" style="margin:0 auto 14px">You get one chance to guess the main drawing prompt.</p><label class="field-label" for="sab-guess" style="text-align:left">What was everyone else drawing?</label><input class="field" id="sab-guess" placeholder="Type your guess" autocomplete="off"><button class="btn coral full" onclick="submitSaboteurGuess()">Lock my guess</button></section>`;
    }
    function submitSaboteurGuess() {
      const guess=(document.getElementById('sab-guess').value||'').trim().toLowerCase();
      if(!guess) { alert('Enter your guess first.'); return; }
      finishSketchRound(guess===round.pair.artist.trim().toLowerCase(),guess===round.pair.artist.trim().toLowerCase()?'sab-guessed':'caught');
    }
    function finishSketchRound(saboteurWon,reason) {
      round.scored=true;
      const r=round;
      const winners=saboteurWon?[r.saboteur]:r.players.map((_,i)=>i).filter(i=>i!==r.saboteur);
      winners.forEach(i=>{const n=r.players[i];scores[n]=(scores[n]||0)+1;}); saveScores();
      const tally=r.voteResult?.tally||{};
      const rows=r.players.map((n,i)=>`<tr><td>${esc(n)} ${i===r.saboteur?'😈':''}</td><td>${tally[i]||0}</td><td>${i===r.saboteur?'Saboteur':'Artist'}</td></tr>`).join('');
      let title,desc;
      if(reason==='tie'){title='It’s a tie!';desc='The group could not agree, so the saboteur escapes.';}
      else if(reason==='miss'){title='Saboteur wins!';desc=`The group voted for ${esc(r.players[r.selected])}, but that player was an artist.`;}
      else if(reason==='sab-guessed'){title='Saboteur steals the win!';desc='The saboteur was caught but guessed the main prompt correctly.';}
      else {title='Artists win!';desc='The saboteur was caught and could not guess the main prompt.';}
      appView.innerHTML = `<p class="eyebrow">SKETCH &amp; SABOTAGE · FINAL RESULTS</p><div class="result-banner ${saboteurWon?'lose':'win'}"><div class="result-trophy">${saboteurWon?'😈':'🏆'}</div><h2>${title}</h2><p style="margin:0;color:var(--muted);line-height:1.5">${desc}</p></div><div class="panel" style="margin-top:13px"><h3>The prompts</h3><div class="record-row" style="margin-top:9px"><span><strong>Artists</strong><br><span class="muted" style="font-size:11px">${esc(r.pair.artist)}</span></span><span>🎨</span></div><div class="record-row" style="margin-top:8px"><span><strong>Saboteur</strong><br><span class="muted" style="font-size:11px">${esc(r.pair.saboteur)}</span></span><span>😈</span></div><h3 style="margin-top:18px">Vote results</h3><table class="results-table"><thead><tr><th>Player</th><th>Votes</th><th>Role</th></tr></thead><tbody>${rows}</tbody></table><h3 style="margin-top:18px">All sketches</h3><div class="gallery">${r.drawings.map(d=>`<div class="drawing-card"><img src="${d.image}" alt="Sketch by ${esc(d.name)}"><strong>${esc(d.name)}</strong></div>`).join('')}</div><button class="btn purple full" onclick="replaySameGame()">Play Again</button><button class="btn outline full" style="margin-top:12px" onclick="goHome()">⌂ &nbsp; Home</button></div>`;
      triggerHaptic(saboteurWon?[30,40,30]:[18,25,18]);
    }

    function replaySameGame() { const game=round?.game||'spy'; openSetup(game); }
    function confirmQuit() { if(confirm('Leave this round? The current round will be lost.')) { clearInterval(drawTimerInterval); drawTimerInterval=null; clearInterval(charadesTimerInterval); charadesTimerInterval=null; goHome(); } }

    renderHome();
  </script>
</body>
</html>
